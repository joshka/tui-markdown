# Configuration for <https://github.com/EmbarkStudios/cargo-deny>.

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[advisories]
version = 2
ignore = [
    # bincode is unmaintained with no successor release; syntect 5 requires it for its built-in
    # syntax and theme dumps.
    { id = "RUSTSEC-2025-0141", reason = "required by syntect, no fixed version available" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
